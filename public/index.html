<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>

    <!-- Real, crawlable description - this is what search engines and
         automated reviewers (including Google's OAuth verification
         crawler) see even if they don't execute JavaScript. -->
    <meta name="description" content="DECENT is a portfolio-sharing app for UI/UX designers. Share your work with one clean link, complete with real interactive Figma prototype embeds instead of static screenshots." />

    <!-- Open Graph tags for link previews on social/messaging apps -->
    <meta property="og:title" content="DECENT - Portfolio Sharing for Designers" />
    <meta property="og:description" content="Share your design work with one clean link, complete with real interactive Figma prototype embeds instead of static screenshots." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.decent.ink" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DECENT - Portfolio Sharing for Designers" />
    <meta name="twitter:description" content="Share your design work with one clean link, complete with real interactive Figma prototype embeds instead of static screenshots." />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* overflow:hidden on body alone doesn't reliably suppress
         document-level scrolling in every browser - html itself needs it
         too, since html and body are separate scrolling boxes and content
         overflowing html's own box can still trigger a native scrollbar on
         the DOCUMENT regardless of what body's own overflow says. This is
         exactly what was showing as a scrollbar that looked "wrong"/inset
         in Chrome: it wasn't the app's own custom scroll indicator (a thin
         purple bar, working correctly) at all - it was this leftover
         native document scrollbar, which Chrome's classic (non-overlay)
         scrollbar rendering made obvious while Firefox's overlay-style
         scrollbar happened to hide from view even though it was still
         there. */
      html {
        overflow: hidden;
      }
      /* Dark is the default/most common theme in the app - setting it here
         directly means the very first paint already matches, with zero
         flash, before any JS has even started. The inline script right
         after this stylesheet corrects it to light for the (`AsyncStorage`)
         minority of users who've switched, before the browser paints
         anything - so neither case ever flashes the wrong color. */
      html, body {
        background-color: #0B0F17;
      }
      /* Applied by the inline script below, before body is even parsed -
         a CSS selector targeting html.light-mode's body descendant applies
         the instant the <body> tag opens, which is reliable in a way that
         trying to set body's own inline style from a <head> script is not
         (document.body doesn't exist yet at that point). */
      html.light-mode, html.light-mode body {
        background-color: #FFFFFF;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* Static fallback content - now lives inside <noscript> in the body
         (see below), so it's completely invisible to any JS-enabled
         browser (no flash at all, ever) while remaining fully present in
         the raw HTML for anything that reads the page without executing
         JS - search engines, the Google OAuth verification crawler,
         link-preview bots. These styles only ever apply in that no-JS
         case, since the element they target simply isn't inserted into
         the DOM at all when scripting is enabled. */
      #static-fallback {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        background: #0B0F17;
        color: #F1F5F9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .fallback-logo {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: #8B5CF6;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 800;
        font-size: 24px;
        margin-bottom: 16px;
      }
      .fallback-title {
        font-size: 24px;
        font-weight: 800;
        margin: 0 0 8px;
      }
      .fallback-desc {
        font-size: 15px;
        color: #94A3B8;
        max-width: 420px;
        line-height: 1.6;
        margin: 0;
      }
    </style>

    <!-- Corrects the background to light mode, synchronously, before the
         browser paints anything - the CSS above already defaults to dark
         (the common case, zero-flash by default), so this only ever needs
         to run for users who've actually switched to light mode. Reads the
         exact same AsyncStorage key/values the app itself writes
         (THEME_STORAGE_KEY = '@decent_theme_mode'; AsyncStorage's web
         implementation is a thin wrapper directly over localStorage, so
         this reads the identical raw value the app wrote, no polyfill
         mismatch). Wrapped in try/catch since localStorage can throw in
         some privacy modes - falls back to the dark default in that case. -->
    <script>
      try {
        if (localStorage.getItem('@decent_theme_mode') === 'light') {
          document.documentElement.classList.add('light-mode');
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <!-- Only ever rendered when JavaScript is disabled/unavailable -
         real users with JS enabled (effectively everyone) never see this,
         not even briefly. Crawlers/verifiers that read raw HTML without
         executing JS still see it exactly as before. -->
    <noscript>
      <div id="static-fallback">
        <div class="fallback-logo">D</div>
        <h1 class="fallback-title">DECENT</h1>
        <p class="fallback-desc">
          A portfolio-sharing app for UI/UX designers. Share your work with one clean link,
          complete with real interactive Figma prototype embeds instead of static screenshots.
        </p>
      </div>
    </noscript>

    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>

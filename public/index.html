<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>DECENT - UI/UX Portfolio Sharing</title>

    <!-- SEO -->
    <meta name="description" content="DECENT is a portfolio-sharing app for UI/UX designers. Share your Figma prototypes, case studies, and design work all in one place - one link for your entire body of work." />
    <link rel="canonical" href="https://decent-portfolio-decent6.vercel.app/" />

    <!-- Open Graph (fallback for the homepage - individual profile/portfolio
         pages get their own dynamic tags from middleware.js) -->
    <meta property="og:site_name" content="DECENT" />
    <meta property="og:title" content="DECENT - UI/UX Portfolio Sharing" />
    <meta property="og:description" content="Share your Figma prototypes, case studies, and design work all in one place." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://decent-portfolio-decent6.vercel.app/" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DECENT - UI/UX Portfolio Sharing" />
    <meta name="twitter:description" content="Share your Figma prototypes, case studies, and design work all in one place." />

    <link rel="icon" href="/favicon.ico" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
